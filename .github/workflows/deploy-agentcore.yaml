name: Deploy Agent to Bedrock AgentCore Runtime


on:
    workflow_dispatch:

env:
    AWS_REGION: us-east-1
    AGENT_NAME: math_agent
    ECR_REPOSITORY: math-agentcore-erc
    CONTAINER_URI: test


permissions:
    id-token: write
    contents: read



jobs:
    validate:
        name: Validate Agent Code
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r app/requirements.txt
                pip install pytest black isort flake8
            
            - name: Format and lint check
              run: |
                    black --check app/math_agent
                    isort --check-only app/math_agent
                    flake8 app/math_agent --max-line-length=88 --extend-ignore=E203,W503
            
    build-and-deploy:
        name: Build and Deploy Agent
        runs-on: ubuntu-latest
        needs: validate
        outputs:
            ecr-repository: ${{steps.set-vars.outputs.ecr-repository}}
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r app/requirements.txt
                pip install boto3

            - name: Dump GitHub Context for OIDC Verification
              run: |
                echo "Actor: ${{ github.actor }}"
                echo "Repository: ${{ github.repository }}"
                echo "Ref: ${{ github.ref }}"
                echo "Event Name: ${{ github.event_name }}"

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v6.2.4
              with:
                role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                role-session-name: GitHubActions-AgentCore-Deploy
                aws-region: ${{env.AWS_REGION}}
                audience: sts.amazonaws.com 

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                platforms: linux/arm64

            - name: Set environment variables
              id: set-vars
              run: |
                AGENT_NAME="math_agent"
                ECR_REPOSITORY="${AGENT_NAME}-agentcore-ecr"
                echo "AGENT_NAME=${AGENT_NAME}" >> $GITHUB_ENV
                echo "ECR_REPOSITORY=${ECR_REPOSITORY}" >> $GITHUB_ENV
                echo "ecr-repository=${ECR_REPOSITORY}" >> $GITHUB_OUTPUT

            - name: Create IAM role
              run: |
                python scripts/create_iam_role.py \
                    --agent-name "${{env.AGENT_NAME}}" \
                    --region "${{env.AWS_REGION}}"
            
            - name: Create Bedrock guardrail
              run: |
                python scripts/create_bedrock_guardrail.py \
                    --region "${{env.AWS_REGION}}"

            - name: Setup ECR Repository
              run: |
                # check if the ECR repository exists, if not create it
                if aws ecr describe-repositories --repository-names ${{env.ECR_REPOSITORY}} --region ${{env.AWS_REGION}} >/dev/null 2>&1; then
                    echo "Respository ${{env.ECR_REPOSITORY}} already exists."
                else
                    echo "Creating repository ${{env.ECR_REPOSITORY}}...."
                    aws ecr create-repository --repository-name ${{env.ECR_REPOSITORY}} --region ${{env.AWS_REGION}} \
                        --image-scanning-configuration scanOnPush=true
                    echo "Repository ${{env.ECR_REPOSITORY}} created successfully."

                    # Enable enchanced scanning (one-time registry setup)
                    aws ecr put-registry-scanning-configuration \
                        --scan-type ENHANCED \
                        --rules  'scanFrequency=SCAN_ON_PUSH,repositoryFilters=[filter="*",filterType="WILDCARD"]' \
                        --region ${{env.AWS_REGION}} 2>/dev/null && echo "Enchanced scanning enabled" || echo "Enchanced scanning setup failed"
                fi

            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v2
            
            - name: Build and push Docker image
              run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                IMAGE_TAG="${GITHUB_SHA:0:8}"
                ECR_URI="${ACCOUNT_ID}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com/${{env.ECR_REPOSITORY}}:${IMAGE_TAG}"
                ECR_LATEST="${ACCOUNT_ID}.dkr.ecr.${{env.AWS_REGION}}.amazonaws.com/${{env.ECR_REPOSITORY}}:latest"

                docker buildx build --platform linux/arm64 -t $ECR_URI -t $ECR_LATEST --push .
                echo "CONTAINER_URI=$ECR_URI" >> $GITHUB_ENV

            - name: Deploy to Agentcore Runtime
              run: |
                python scripts/deploy_agent_to_dockerimg.py \
                    --agent-name "${{env.AGENT_NAME}}" \
                    --region "${{env.AWS_REGION}}" \
                    --container-uri "${{env.CONTAINER_URI}}"
    
    cleanup:
        name: Clean Old Images
        runs-on: ubuntu-latest
        needs: build-and-deploy

        if: success()

        steps:
            - name: Checkout Code
              uses: actions/checkout@v6
            
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                role-to-assume: ${{secrets.AWS_ROLE_ARN}}
                role-session-name: GitHubActions-AgentCore-Cleanup
                aws-region: ${{env.AWS_REGION}}
            
            - name: Clean up old ECR images
              run: |
                python scripts/cleanup_ecr.py \
                    --region "${{env.AWS_REGION}}" \
                    --repository-name "${{needs.build-and-deploy.outputs.ecr-repository}}"